# Fallback: deploy the API as an always-on Node service on Render.
# (Frontends still go to Vercel; database still Neon.) See docs/DEPLOY.md.
services:
  - type: web
    name: pilates-api
    runtime: node
    rootDir: apps/api
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: 'true'
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CANCELLATION_WINDOW_HOURS_DEFAULT
        value: '2'
      - key: SWEEP_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      # in-process cron works on Render, so leave DISABLE_IN_PROCESS_CRON unset
