# NOTE: This machine has no Docker runtime installed. Phase 1 was developed against a
# local Homebrew PostgreSQL 14 instance (databases: pilates_dev, pilates_test, both on :5432).
# This file is kept so anyone with Docker can spin up an equivalent environment.
# If you use it, point DATABASE_URL / TEST_DATABASE_URL at ports 5432 / 5433 with user "pilates".
version: '3.8'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pilates
      POSTGRES_PASSWORD: pilates
      POSTGRES_DB: pilates_dev
    ports:
      - '5432:5432'
    volumes:
      - pilates_pg_data:/var/lib/postgresql/data
  postgres_test:
    image: postgres:16
    environment:
      POSTGRES_USER: pilates
      POSTGRES_PASSWORD: pilates
      POSTGRES_DB: pilates_test
    ports:
      - '5433:5432'
volumes:
  pilates_pg_data:
